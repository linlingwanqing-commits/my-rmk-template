name: Build planck59

on:
  push:
    paths:
      - '52840_planck59/**'
      - '.github/workflows/planck59.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rust-src

      - name: Install cargo-make and flip-link
        run: |
          cargo install cargo-make
          cargo install flip-link

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 52840_planck59

      - name: Build UF2 firmware
        working-directory: 52840_planck59
        run: cargo make uf2 --release
        env:
          RUST_MIN_STACK: 16777216

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: planck59-uf2
          path: ${{ github.workspace }}/52840_planck59/*.uf2
