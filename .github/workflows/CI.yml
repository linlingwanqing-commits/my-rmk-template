name: Build Firmware (nRF52840)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./52840_sevenangle

    steps:
      - uses: actions/checkout@v4

       # 步骤1: 安装 Rust 和 nRF52840 目标架构
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rust-src

      # 步骤2: 安装 cargo-make 和 flip-link
      - name: Install cargo-make and flip-link
        run: |
          cargo install cargo-make
          cargo install flip-link

      # 步骤3: 缓存依赖
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 步骤4: 生成 UF2 固件（左右手各一个）
      - name: Build UF2 firmware
        run: cargo make uf2 --release
        env:
          RUST_MIN_STACK: 16777216

      - name: Debug - list all files
        run: |
          echo "=== 根目录 ==="
          ls -la
          echo "=== 所有 uf2 ==="
          find . -name "*.uf2" -type f 2>/dev/null
          echo "=== 所有 hex ==="
          find . -name "*.hex" -type f 2>/dev/null
          echo "=== target 目录 ==="
          find target -name "*.hex" -o -name "*.uf2" 2>/dev/null | head -50

      # 步骤5: 上传两个 .uf2 文件
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sevenangle-uf2
          path: |
            ${{ github.workspace }}/rmk-7angle-central.uf2
            ${{ github.workspace }}/rmk-7angle-peripheral.uf2