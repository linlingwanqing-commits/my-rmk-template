name: Build Firmware (nRF52840)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./52840_planck59

    steps:
      - uses: actions/checkout@v4

      # 步骤1: 安装 Rust 和 nRF52840 目标架构
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rust-src

      # 步骤2: 安装 cargo-make 和 flip-link
      # RMK 的 uf2 生成依赖 cargo-make，flip-link 是 nRF52840 推荐的链接器
      - name: Install cargo-make and flip-link
        run: |
          cargo install cargo-make
          cargo install flip-link

      # 步骤3: 缓存依赖（可选，但能加速后续构建）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 步骤4: 生成 UF2 固件
      - name: Build UF2 firmware
        run: cargo make uf2 --release

      # 步骤5: 查找并上传 .uf2 文件
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: planck59-uf2
          # RMK 生成的 uf2 文件通常放在项目根目录，文件名取决于你的 keyboard.toml 配置
          # 先列出所有 uf2 文件方便调试，再上传
          path: 52840_planck59/*.uf2